[project]
name = "perdigao-attribution-v1.1"
version = "1.1.0"
description = "Internal-freeze re-run of Perdigao attribution v1.0 with fixed group definition P=R+Xp (core4 primary). No OSF preregistration."
requires-python = "==3.12.*"
readme = "README.md"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "xarray>=2024.2",
    "netcdf4>=1.6",
    "h5netcdf>=1.3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perdigao_attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
