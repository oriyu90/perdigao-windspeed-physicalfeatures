qc_primary_exclusions:
- ldiag_20m/tse13 != 0 or ldiag_100m/tse13 != 0 -> exclude stamp
- dir_100m in [310,340] deg (paper-reported tower-shadow sector) -> exclude in primary;
  include-all as sensitivity
- no irgadiag var at tse13 -> rely on dataset QC spike-threshold removal (Data Report
  p.1); documented
